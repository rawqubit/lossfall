name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Model tests — gradients, training, sampling
        run: node --test tests/engine.test.mjs
      - name: index.html matches its sources
        run: python3 build.py --check
      - name: The page trains in a real browser
        run: node tests/page.test.mjs
